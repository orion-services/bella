
# ==============================================================================
# Profiles
# ==============================================================================
# This file holds the DEFAULT configuration, effectively used by both the "dev"
# (./mvnw quarkus:dev) and "test" (./mvnw test) profiles, since neither overrides
# most of it. Profile-specific overrides live in separate files, automatically
# merged on top of this one by Quarkus — no "%dev."/"%prod." prefix needed there:
#   - application-dev.properties  — OpenAI chat + embeddings (same scheme as prod),
#     Orion Users via Compose Dev Services, and the few settings that differ in
#     dev mode specifically (not in test)
#   - application-test.properties — disables the Orion Users Compose service so
#     tests keep the local Ollama chat model
#   - application-prod.properties — same OpenAI models, plus Redis/Postgres
#     endpoints, RAG path, etc. for the real Docker Compose deployment

# ==============================================================================
# SSL
# ==============================================================================
# Self-signed certificate for HTTPS on 8444, in addition to plain HTTP on 8080.
quarkus.http.port=8080
quarkus.http.ssl-port=8444
quarkus.http.ssl.certificate.key-store-file=keystore.jks
quarkus.http.ssl.certificate.key-store-file-type=PKCS12
quarkus.http.ssl.certificate.key-store-password=password
quarkus.http.insecure-requests=enabled

# CORS: allows the Vue frontend to call the API from a different origin in dev
# (Vite on 5173). In prod the frontend is served by this same Quarkus app (same
# origin), but CORS is kept enabled/permissive so it also works if the SPA is ever
# hosted separately.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/

# ==============================================================================
# Security / JWT — Orion Users (validation only)
# ==============================================================================
# Bella only *verifies* JWTs issued by the Orion Users service (asymmetric RSA
# signature); it never issues its own tokens. Login itself happens against Orion
# Users directly from the frontend (see frontend/src/services/orionUsers.js).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=orion-users

# Public paths: static assets, the WhatsApp webhook (Meta's own contract) and the
# legacy phone-based /bella/chat endpoint (used only by the WhatsApp channel, see
# BellaResource). Everything else under /bella/users, /bella/conversations, /bella/memory
# and /bella/chatbot requires a valid JWT with the "user" role.
quarkus.http.auth.permission.public.paths=/,/assets/*,/webhook/*,/bella/chat,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit

# ==============================================================================
# LLM — Ollama (default provider; used by the test profile only)
# ==============================================================================
# Tests keep a local Ollama chat model (gemma4) so ./mvnw test does not need
# OPENAI_API_KEY. Dev and prod override this block and use OpenAI gpt-4o-mini
# (see application-dev.properties and application-prod.properties).
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.openai.chat-model.enabled=false
quarkus.langchain4j.ollama.chat-model.model-name=gemma4:e2b
quarkus.langchain4j.ollama.chat-model.temperature=1
# Default client timeout (10s) is too short for local Ollama inference; raise it to
# avoid NoStackTraceTimeoutException on slower models/hardware (e.g. WhatsApp replies).
quarkus.langchain4j.ollama.timeout=PT2M
# gemma4 has "thinking" capability. think=false keeps the reply in the answer field.
# num-predict is the max answer length once thinking is off. Used by the test profile.
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.chat-model.num-predict=2048

# ==============================================================================
# Conversation memory — Redis
# ==============================================================================
# Sliding window of messages per @MemoryId
# Persisted in Redis via quarkus-langchain4j-memory-store-redis (automatic ChatMemoryStore bean)
quarkus.langchain4j.chat-memory.memory-window.max-messages=20
# Redis connection itself (Dev Services provisions it automatically in dev/test;
# overridden in application-prod.properties to point at the Docker Compose container)

# ==============================================================================
# pgvector — embedding storage
# ==============================================================================
# Dev Services starts Postgres with the vector extension.
# dimension=384 matches the local embedding model (all-MiniLM-L6-v2) used in test.
# Dev and prod override this to 1536 for OpenAI text-embedding-3-small
# (see application-dev.properties and application-prod.properties).
quarkus.langchain4j.pgvector.dimension=384
quarkus.langchain4j.pgvector.create-table=true

# ==============================================================================
# RAG — Retrieval-Augmented Generation
# ==============================================================================
# Directory with base documents (PDF, text, etc.) automatically ingested on startup.
# Default is a filesystem path relative to the project root, used in dev/test.
# Overridden in application-prod.properties, since the Docker image copies these
# same files into /work/rag (see Dockerfile.jvm).
rag.location=src/main/resources/rag

# Number of context chunks retrieved per message
rag.max-results=3
# Minimum similarity score for a chunk to be used as context
rag.min-score=0.6

# Maximum idle time (in minutes) between user messages before a new chat session starts
chat.inactivity-threshold-minutes=30

# URL scraping (WebScraper/WebScraperPort)
rag.scrape.save-markdown=false
rag.scrape.save-markdown.dir=target/scraped-markdown
# rag.scrape.timeout-seconds=30
# rag.scrape.user-agent=Bella-RAG-Scraper/1.0

rag.scrape.urls=https://cpw2.rpmhub.dev/introducao/introducao.html,\
  https://cpw2.rpmhub.dev/variaveis/variaveis.html,\
  https://cpw2.rpmhub.dev/tipos/tipos.html,\
  https://cpw2.rpmhub.dev/operadores/operadores.html,\
  https://cpw2.rpmhub.dev/controle/controle.html,\
  https://cpw2.rpmhub.dev/funcoes/funcoes.html,\
  https://cpw2.rpmhub.dev/dom/dom.html,\
  https://cpw2.rpmhub.dev/ajax/ajax.html,\
  https://cpw2.rpmhub.dev/exercicios/simulados.html

# ==============================================================================
# Chat persistence — Postgres
# ==============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
# Apply explicit compatibility migrations before Hibernate updates the model.
# Baseline at version 0 lets V1 run against existing pre-Flyway databases while
# also remaining safe for a brand-new database.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Fixed credentials for the Postgres Dev Services database (dev/test mode).
# Overridden in application-prod.properties to use the real Docker Compose database.
quarkus.datasource.username=bella
quarkus.datasource.password=bella
quarkus.datasource.devservices.db-name=bella
quarkus.datasource.devservices.port=5432

# ==============================================================================
# WhatsApp Cloud API — Meta (optional)
# ==============================================================================
# If not configured, only the web interface works (no outbound calls are made).
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:bella-webhook-verify}
# Meta App Secret, used to validate the webhook's X-Hub-Signature-256 signature.
# If empty, validation is disabled (only a warning is logged).
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
# OpenAI key used to transcribe WhatsApp audio messages (Whisper). In dev and prod
# this is the same OPENAI_API_KEY also used as the chat and embedding model
# (see application-dev.properties and application-prod.properties). In test it is
# only needed if a test exercises WhatsApp audio transcription.
whatsapp.openai-api-key=${OPENAI_API_KEY:}
