# ==============================================================================
# Test-only overrides
# ==============================================================================
# Applied automatically when running with the "test" profile (./mvnw test).
# No "%test." prefix needed here — every property in this file is scoped to test.

# Orion Users is a dev-mode Compose service (compose-devservices.yml). Tests keep
# the local Ollama chat model from application.properties and do not build or
# start the users container.
quarkus.compose.devservices.enabled=false
