# ==============================================================================
# Dev-only overrides
# ==============================================================================
# Applied automatically when running with the "dev" profile (./mvnw quarkus:dev).
# No "%dev." prefix needed here — every property in this file is scoped to dev.

# Quarkus dev mode validates the Host header against localhost/127.0.0.1 by default,
# which blocks requests forwarded through tunnels (ngrok) using a public hostname.
quarkus.http.host-validation.require-localhost=false

# ------------------------------------------------------------------------------
# LLM — OpenAI gpt-4o-mini (same scheme as application-prod.properties)
# ------------------------------------------------------------------------------
# Dev uses the OpenAI API via OPENAI_API_KEY, loaded from the environment or from
# a .env file at the project root. The test profile keeps the Ollama/MiniLM
# defaults in application.properties and does not read this file.
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.ollama.chat-model.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini

# Embeddings — OpenAI text-embedding-3-small (1536 dimensions).
# The in-process MiniLM bean is test-only (see EmbeddingModelProducer), so this
# profile must select the OpenAI provider or the build fails with several
# candidates (OpenAI, Ollama, in-process MiniLM). The same OPENAI_API_KEY is used.
# create-table does not alter an existing vector(384) column from the previous
# local model: drop the embeddings table once before the first boot, then let
# startup recreate and re-ingest it.
quarkus.langchain4j.embedding-model.provider=openai
quarkus.langchain4j.openai.embedding-model.enabled=true
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.pgvector.dimension=1536

# ------------------------------------------------------------------------------
# Orion Users — Compose Dev Services (compose-devservices.yml)
# ------------------------------------------------------------------------------
# quarkus:dev clones orion-services/users from GitHub and starts it on port 8082.
# The image is rebuilt on each dev start so main is picked up; Docker layer cache
# skips the Maven build when that commit did not change. The users database volume
# is kept when dev mode stops. The first start can take several minutes.
quarkus.compose.devservices.files=compose-devservices.yml
quarkus.compose.devservices.build=true
quarkus.compose.devservices.remove-volumes=false
quarkus.compose.devservices.startup-timeout=10m
quarkus.compose.devservices.follow-container-logs=true
